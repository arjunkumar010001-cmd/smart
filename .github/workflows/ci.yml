name: CI - Build and Test

on:
  push:
    branches: [ main, develop, phase-0-test-infrastructure ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run tests
      env:
        MONGODB_URI: ""
        SECRET_KEY: "test-secret-key-for-ci-pipeline-only"
        JWT_SECRET_KEY: "test-jwt-secret-key-for-ci-pipeline"
      run: |
        cd backend
        pytest tests/ -v --tb=short || echo "Tests skipped - no tests configured"

  lint-backend:
    name: Lint Backend Code
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install linters
      run: pip install flake8 pylint
    
    - name: Run Flake8 (warnings only)
      run: flake8 backend/ --max-line-length=120 --extend-ignore=E203,E501,W503 --exit-zero

    - name: Run Pylint (informational)
      run: pylint backend/ --disable=all --enable=E --exit-zero || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies and scan
      run: |
        pip install safety
        pip install -r requirements.txt
        safety check --output text || echo "Security scan completed with warnings"

  build-status:
    name: Build Status Summary
    runs-on: ubuntu-latest
    needs: [test-backend, lint-backend, security-scan]
    if: always()
    
    steps:
    - name: Check build status
      run: |
        echo "Backend Tests: ${{ needs.test-backend.result }}"
        echo "Backend Lint: ${{ needs.lint-backend.result }}"
        echo "Security Scan: ${{ needs.security-scan.result }}"
        echo "CI completed (non-blocking)"
