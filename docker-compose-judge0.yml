# =============================================================================
# Self-Hosted Judge0 CE — Code Execution Engine
# =============================================================================
# Start:   docker-compose -f docker-compose-judge0.yml up -d
# Stop:    docker-compose -f docker-compose-judge0.yml down
# Status:  docker ps | findstr judge0
# Test:    curl http://localhost:2358/system_info
# =============================================================================

version: "3.8"

services:
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: judge0-server
    ports:
      - "2358:2358"
    privileged: true
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://judge0-redis:6379
      - POSTGRES_HOST=judge0-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0_password
      # Execution limits (tune as needed)
      - CPU_TIME_LIMIT=10
      - CPU_EXTRA_TIME=5
      - WALL_TIME_LIMIT=20
      - MEMORY_LIMIT=256000
      - MAX_PROCESSES_AND_OR_THREADS=60
      - ENABLE_WAIT_RESULT=true
      - ENABLE_COMPILER_OPTIONS=true
      - ALLOW_ENABLE_NETWORK=true
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: judge0-workers
    command: ["./scripts/workers"]
    privileged: true
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://judge0-redis:6379
      - POSTGRES_HOST=judge0-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0_password
      - CPU_TIME_LIMIT=10
      - CPU_EXTRA_TIME=5
      - WALL_TIME_LIMIT=20
      - MEMORY_LIMIT=256000
      - MAX_PROCESSES_AND_OR_THREADS=60
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-db:
    image: postgres:15-alpine
    container_name: judge0-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0_password
    volumes:
      - judge0-postgres-data:/var/lib/postgresql/data

  judge0-redis:
    image: redis:7-alpine
    container_name: judge0-redis
    restart: unless-stopped
    volumes:
      - judge0-redis-data:/data

volumes:
  judge0-postgres-data:
  judge0-redis-data:
